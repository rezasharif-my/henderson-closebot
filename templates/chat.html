<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat with Jack Henderson</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f2f4f8;
    }

    header {
      background: #0a2342;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .chat-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat-container {
      flex: 1;
      max-width: 700px;
      margin: auto;
      width: 100%;
      padding: 20px;
      background: white;
      overflow-y: auto;
      scroll-behavior: smooth;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .message {
      margin: 10px 0;
      padding: 12px 16px;
      border-radius: 20px;
      max-width: 75%;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user {
      background-color: #e0f7fa;
      color: #00796b;
      margin-left: auto;
      text-align: right;
    }

    .jack {
      background-color: #0a2342;
      color: #fff;
      margin-right: auto;
      text-align: left;
    }

    form.chat-form {
      display: flex;
      padding: 10px;
      background: #fff;
      position: sticky;
      bottom: 0;
      width: 100%;
      max-width: 700px;
      margin: auto;
      gap: 10px;
      border-top: 1px solid #ddd;
    }

    form.chat-form input[type="text"] {
      flex: 1;
      padding: 10px 15px;
      border-radius: 20px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    form.chat-form button {
      background: #0a2342;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    footer {
      background-color: #0a2342;
      color: white;
      text-align: center;
      padding: 10px 0;
      font-size: 0.9rem;
    }

    footer span {
      color: #00e6e6;
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <header>
      Chat with Jack Henderson
      <small style="display: block; font-size: 0.9rem; color: #ccc;">Direct property advice, Jack style.</small>
      <form method="post" action="/reset" style="text-align:center; margin-top:10px; float: right; ">
        <button type="submit" style="background:#f44336; color:white; border:none; padding:8px 16px; border-radius:10px; cursor: pointer !important;">
          🔄 Reset Chat
        </button>
        </form>
    </header>

    <div class="chat-container" id="chatbox">
      {% for c in chat %}
        <div class="message {{ c.from }}">
          {{ c.msg }}
        </div>
      {% endfor %}
    </div>

    <form method="post" class="chat-form">
      <input type="text" name="message" placeholder="Type your message..." required />
      <button type="submit">Send</button>
    </form>

    <footer>
      Developed with ❤️ by <span>Reza Sharif</span>
    </footer>
  </div>



  <script>
    // Auto-scroll to bottom on page load
    window.onload = function () {
      const chatbox = document.getElementById("chatbox");
      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
