<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat with Jack Henderson</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f2f4f8;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #0a2342;
      color: white;
      padding: 20px;
      text-align: center;
      font-weight: bold;
    }

    header small {
      display: block;
      font-weight: normal;
      font-size: 0.9rem;
      margin-top: 5px;
      color: #ccc;
    }

    .chat-container {
      flex: 1;
      max-width: 700px;
      margin: 2rem auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      padding: 20px;
    }

    .message {
      margin: 10px 0;
      padding: 12px 16px;
      border-radius: 20px;
      max-width: 75%;
      line-height: 1.4;
    }

    .user {
      background-color: #e0f7fa;
      color: #00796b;
      text-align: right;
      margin-left: auto;
    }

    .jack {
      background-color: #0a2342;
      color: #fff;
      text-align: left;
      margin-right: auto;
    }

    form {
      display: flex;
      margin-top: 20px;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 15px;
      border-radius: 20px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      background: #0a2342;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #0e2e5b;
    }

    footer {
      background-color: #0a2342;
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 0.9rem;
    }

    footer span {
      color: #00e6e6;
    }
  </style>
</head>
<body>

<header>
  Chat with Jack Henderson
  <small>Instant property advice in Jack's voice – no excuses, just action.</small>
</header>

<div class="chat-container">
  {% for c in chat %}
    <div class="message {{ c.from }}">
      {{ c.msg }}
    </div>
  {% endfor %}

  <form method="post">
    <input type="text" name="message" placeholder="Type your message..." required />
    <button type="submit">Send</button>
  </form>
</div>

<footer>
  Developed by <span>Reza Sharif</span>
</footer>

</body>
</html>
